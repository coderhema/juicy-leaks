# HTTP target: any chatbot API that takes JSON in and returns JSON out.
# Try it with the bundled demo bot:  python examples/http_demo_bot.py
name: Demo HTTP bot
type: http
description: chatbot behind an HTTP API
secrets:                   # canaries you planted in the bot (fake)
  - VIP-NAIRA-7781
  - sk_test_fake_9f8e7d6c
endpoint:
  url: http://127.0.0.1:8088/chat
  headers:
    Authorization: "Bearer ${MY_BOT_TOKEN}"   # expanded from env, keeps tokens out of YAML
  body_field: message      # request JSON: {"message": "<attack>"}
  response_field: reply    # response JSON: {"reply": "<answer>"}
  # extra_body: {session_id: "redteam"}

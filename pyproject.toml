[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "juicy-leaks"
version = "0.1.0"
description = "AI red-team tool for chatbots, powered by Llama"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6", "python-dotenv>=1.0", "mcp>=1.9,<2", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "pandas>=2"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
juicy-leaks = "juicy_leaks.cli:main"
guardrail-lens = "juicy_leaks.cli:main"  # old name, kept as an alias

[tool.setuptools]
packages = ["juicy_leaks"]

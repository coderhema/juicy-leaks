[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-lens"
version = "0.1.0"
description = "AI red-team tool for chatbots, powered by Llama"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6", "python-dotenv>=1.0", "mcp>=1.9,<2"]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "pandas>=2"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
guardrail-lens = "guardrail_lens.cli:main"

[tool.setuptools]
packages = ["guardrail_lens"]
